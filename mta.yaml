_schema-version: "3.2"
ID: SACDE-ABM-PCE-CENTRO-UI5
version: 0.0.1
modules:
- name: SACDE-ABM-PCE-CENTRO-UI5-destination-content
  type: com.sap.application.content
  requires:
  - name: SACDE-ABM-PCE-CENTRO-UI5-destination-service
    parameters:
      content-target: true
  - name: SACDE-ABM-PCE-CENTRO-UI5_html_repo_host
    parameters:
      service-key:
        name: SACDE-ABM-PCE-CENTRO-UI5_html_repo_host-key
  - name: uaa_SACDE-ABM-PCE-CENTRO-UI5
    parameters:
      service-key:
        name: uaa_SACDE-ABM-PCE-CENTRO-UI5-key
  parameters:
    content:
      instance:
        destinations:
        - Name: SACDE_ABM_PCE_CENTRO_UI5_SACDE_ABM_PCE_CENTRO_UI5_html_repo_host
          ServiceInstanceName: ~{SACDE-ABM-PCE-CENTRO-UI5_html_repo_host/service-name}
          ServiceKeyName: SACDE-ABM-PCE-CENTRO-UI5_html_repo_host-key
          sap.cloud.service: approuter-abm-pce-centro
        - Authentication: OAuth2UserTokenExchange
          Name: SACDE_ABM_PCE_CENTRO_UI5_uaa_SACDE_ABM_PCE_CENTRO_UI5
          ServiceInstanceName: SACDE-ABM-PCE-CENTRO-UI5-xsuaa-service
          ServiceKeyName: uaa_SACDE-ABM-PCE-CENTRO-UI5-key
          sap.cloud.service: approuter-abm-pce-centro
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: SACDE-ABM-PCE-CENTRO-UI5-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: SACDE-ABM-PCE-CENTRO-UI5_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - sacdeabmpcecentroui5.zip
      name: sacdeabmpcecentroui5
      target-path: resources/
- name: sacdeabmpcecentroui5
  type: html5
  path: sacde-abm-pce-centro-ui5
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: SACDE-ABM-PCE-CENTRO-UI5-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: SACDE-ABM-PCE-CENTRO-UI5-destination-service
    service-plan: lite
- name: SACDE-ABM-PCE-CENTRO-UI5_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: SACDE-ABM-PCE-CENTRO-UI5-html5-app-host-service
    service-plan: app-host
  properties:
    service-name: ${service-name}
- name: uaa_SACDE-ABM-PCE-CENTRO-UI5
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: SACDE-ABM-PCE-CENTRO-UI5-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
